name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v3-

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show real error
        if: failure()
        run: |
          echo "=== Lines with errors ==="
          grep -n -i -E "error|exception|FAILURE|What went wrong|Could not" build.log | tail -n 40
          echo "=== Last 100 lines before the final Command failed ==="
          grep -n "Command failed" build.log | head -1
          tail -n 250 build.log | head -n 100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yt-downloader-apk
          path: bin/*.apk
